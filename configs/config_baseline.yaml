augmentation:
  clahe:
    clip_limit: 2.0
    p: 1.0
    tile_grid_size:
    - 8
    - 8
  normalization:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  spatial:
    elastic_transform:
      alpha: 1
      p: 0.3
      sigma: 50
    grid_distortion:
      distort_limit: 0.3
      num_steps: 5
      p: 0.3
    horizontal_flip_p: 0.5
    random_rotate90_p: 0.5
    shift_scale_rotate:
      p: 0.5
      rotate_limit: 15
      scale_limit: 0.1
      shift_limit: 0.0625
    vertical_flip_p: 0.5
dataset:
  image_size:
  - 256
  - 256
  in_channels: 3
  name: neu_surface_defect_seg
  num_classes: 1
  processed_dir: data/processed
  random_seed: 42
  raw_dir: data/raw
  split_ratios:
    test: 0.15
    train: 0.7
    val: 0.15
inference:
  assets_dir: assets
  checkpoint_path: checkpoints/best_unet_resnet34.pth
  confidence_threshold: 0.5
  max_defect_area_pct_pass: 0.5
  min_contour_area: 15
  overlay:
    alpha: 0.45
    color:
    - 255
    - 40
    - 40
    contour_thickness: 2
loss:
  bce_weight: 0.5
  dice_weight: 0.5
  focal_tversky:
    alpha: 0.7
    beta: 0.3
    gamma: 1.33
  smooth: 1.0
  type: bce
model:
  activation: null
  architecture: unet
  classes: 1
  encoder_name: null
  encoder_weights: null
  in_channels: 3
training:
  amp: true
  batch_size: 16
  checkpoint_dir: checkpoints
  checkpoint_name: baseline_unet_scratch.pth
  device: cuda
  epochs: 30
  metric_to_track: val_dice
  num_workers: 4
  optimizer:
    lr: 0.0001
    name: AdamW
    weight_decay: 1.0e-05
  save_best_only: true
  scheduler:
    factor: 0.5
    min_lr: 1.0e-06
    name: CosineAnnealingLR
    patience: 3
    t_max: 30
